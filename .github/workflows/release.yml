name: Build and Release WFX Plugin

on:
  push:
    branches:
      - main # Срабатывает при любом пуше в ветку main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Build 32-bit (win-x86)
        run: dotnet publish src/TgVfsPlugin/TgVfsPlugin.csproj -c Release -r win-x86 /p:NativeLib=Shared /p:SelfContained=true -o out_x86
        
      - name: Prepare Plugin Package
        run: |
          mkdir ReleasePackage
          mkdir ReleasePackage\x86
          copy out_x86\TgVfsPlugin.dll ReleasePackage\TgVfsPlugin.wfx
          copy pluginst.inf ReleasePackage\pluginst.inf
          
          $sqlite86 = Get-ChildItem -Path out_x86 -Filter e_sqlite3.dll -Recurse | Select-Object -First 1
          if ($sqlite86) { Copy-Item $sqlite86.FullName -Destination ReleasePackage\x86\e_sqlite3.dll }
          
      - name: Zip Plugin
        run: Compress-Archive -Path ReleasePackage\* -DestinationPath TelegramVFS.zip
        
      - name: Get commit message
        id: commit_msg
        run: echo "msg=$(git log -1 --pretty=%s)" >> $env:GITHUB_OUTPUT
        
      - name: Update Continuous Release
        uses: softprops/action-gh-release@v2
        with:
          files: TelegramVFS.zip
          name: "Build: ${{ steps.commit_msg.outputs.msg }}"
          body: "Auto-generated build for commit: ${{ github.sha }}"
          tag_name: latest
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
